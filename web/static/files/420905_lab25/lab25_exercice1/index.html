        <h2>Exercice 1 - Roue du destin 🔮🎲</h2>
        <p>
            Posez une question de votre choix qui se répond par Oui ou par Non à la roue pour connaître votre destinée.
            Penser à la question dans votre tête est suffisant : la roue entend vos pensées 🙄
        </p>
