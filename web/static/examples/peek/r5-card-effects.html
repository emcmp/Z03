<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body{font-family:Arial,sans-serif;margin:28px;color:#263238}
    .carte{max-width:340px;background:#eaf3ff;border:2px solid #245a86;padding:18px 22px;border-radius:12px;box-shadow:0 4px 12px rgb(0 0 0 / 20%);transition:transform .2s}
    .carte:hover{transform:scale(1.03)}
    .carte h2{margin-top:0}
  </style>
</head>
<body>
  <div class="carte">
    <h2>Photo</h2>
    <p>Passez la souris sur la carte pour voir le léger agrandissement.</p>
  </div>
</body>
</html>
