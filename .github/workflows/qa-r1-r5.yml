name: QA temporaire R1-R5

on:
  push:
    branches:
      - agent/qa-finale-r1-r5
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Vérifier les deux variantes du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        working-directory: web
        run: npm ci

      - name: Vérifier TypeScript
        working-directory: web
        run: npm run typecheck

      - name: Construire le site étudiant
        working-directory: web
        run: npm run build

      - name: Construire le site interne avec la refonte
        working-directory: web
        run: npm run build:refonte
