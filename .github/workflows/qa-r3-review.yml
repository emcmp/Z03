name: QA temporaire revue R3

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  qa:
    name: Verifier la rencontre 3 et les deux variantes du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dependances
        working-directory: ./web
        run: npm ci

      - name: Verifier TypeScript
        working-directory: ./web
        run: npm run typecheck

      - name: Construire le site etudiant
        working-directory: ./web
        run: npm run build

      - name: Construire le site interne avec la refonte
        working-directory: ./web
        run: npm run build:refonte
